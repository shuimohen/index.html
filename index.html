<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>排列五号码统计筛选极速工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,Segoe UI,sans-serif;}
body{background:#f0f2f5;padding:12px;max-width:960px;margin:0 auto;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center;}
.digit{width:40px;height:40px;border-radius:8px;border:1px solid #dcdfe6;display:grid;place-items:center;cursor:pointer;font-weight:600;background:#4096ff;color:#fff;border-color:#4096ff;transition:all .2s;}
.digit.inactive{background:#fff;color:#222;border-color:#dcdfe6;}
.btn{padding:10px 16px;border:none;border-radius:8px;background:#4096ff;color:#fff;cursor:pointer;font-size:15px;}
.btn.gray{background:#909399;}
.btn.green{background:#67c23a;}
.tip{margin:8px;color:#333;font-weight:500;}
input[type="text"]{padding:9px 10px;border:1px solid #dcdfe6;border-radius:8px;font-size:15px;width:260px;}
input[type="number"]{padding:8px 6px;border:1px solid #dcdfe6;border-radius:8px;width:60px;font-size:15px;}
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <button id="fetchBtn" class="btn">一键获取近100期排列五</button>
    <button id="parseBtn" class="btn gray">解析数据</button>
    <span id="tipBox" class="tip">无数据</span>
  </div>
  <div class="row">
    <span>上期开奖(5位):</span>
    <input type="text" id="lastNumInput" placeholder="如01490">
    <button id="execKillBtn" class="btn">执行差5/和9杀号</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="useDiff5" checked> 启用【差5恒值杀号】</label>
    <label><input type="checkbox" id="useSum9" checked> 启用【和9恒值杀号】</label>
  </div>
</div>

<div class="card">
  <div>万 | 千 | 百 | 十 | 个 可选数字(点击色块切换蓝选)</div>
  <div class="row">
    <span style="width:44px;">万位</span>
    <div class="row" id="wDigits"></div>
  </div>
  <div class="row">
    <span style="width:44px;">千位</span>
    <div class="row" id="qDigits"></div>
  </div>
  <div class="row">
    <span style="width:44px;">百位</span>
    <div class="row" id="bDigits"></div>
  </div>
  <div class="row">
    <span style="width:44px;">十位</span>
    <div class="row" id="sDigits"></div>
  </div>
  <div class="row">
    <span style="width:44px;">个位</span>
    <div class="row" id="gDigits"></div>
  </div>
</div>

<div class="card">
  <div>和尾过滤（前三位和尾）</div>
  <div class="row" id="hwDigits"></div>
  <div class="row">
    <label><input type="checkbox" id="useHwFilter" checked> 启用筛选:</label>
  </div>
</div>

<div class="card">
  <div>排除前三位和值（0-27）</div>
  <div class="row" id="sum3Digits"></div>
  <div class="row">
    <button class="btn gray" id="clearSum3">清空全部排除和值</button>
    <button class="btn gray" id="resetHw">重置和尾</button>
  </div>
</div>

<div class="card">
  <div>排除五位和值（0-45）</div>
  <div class="row" id="sum5Digits"></div>
  <div class="row">
    <button class="btn gray" id="clearSum5">清空全部排除五位和值</button>
  </div>
</div>

<div class="card">
  <div>五位跨度筛选（号码最大值-最小值，范围0~9）</div>
  <div class="row">
    <span>最小跨度:</span>
    <input type="number" id="minSpan" value="0" min="0" max="9">
    <span>最大跨度:</span>
    <input type="number" id="maxSpan" value="9" min="0" max="9">
    <label><input type="checkbox" id="useSpan" checked> 启用跨度:</label>
  </div>
</div>

<div class="card">
  <div class="row">
    <button id="genBtn" class="btn green">生成符合条件号码</button>
    <button id="copyBtn" class="btn">复制全部结果</button>
  </div>
  <div style="margin-top:14px;">
    <div>号码验证</div>
    <div class="row">
      <input type="text" id="verifyInput" placeholder="输入5位号码验证">
      <button id="verifyBtn" class="btn">验证号码</button>
    </div>
  </div>
</div>

<script>
let rawDataList = [];
const tipBox = document.getElementById('tipBox');

// 渲染0-9数字块，默认蓝色
function render0to9(containerId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  for(let i=0;i<=9;i++){
    const d = document.createElement('div');
    d.className = 'digit';
    d.innerText = i;
    d.dataset.val = i;
    d.onclick = ()=>d.classList.toggle('inactive');
    wrap.appendChild(d);
  }
}
// 渲染0~27 和值
function render0to27(containerId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  for(let i=0;i<=27;i++){
    const d = document.createElement('div');
    d.className = 'digit';
    d.innerText = i;
    d.dataset.val = i;
    d.onclick = ()=>d.classList.toggle('inactive');
    wrap.appendChild(d);
  }
}
// 渲染0~45 和值
function render0to45(containerId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  for(let i=0;i<=45;i++){
    const d = document.createElement('div');
    d.className = 'digit';
    d.innerText = i;
    d.dataset.val = i;
    d.onclick = ()=>d.classList.toggle('inactive');
    wrap.appendChild(d);
  }
}

// 初始化渲染
render0to9('wDigits');
render0to9('qDigits');
render0to9('bDigits');
render0to9('sDigits');
render0to9('gDigits');
render0to9('hwDigits');
render0to27('sum3Digits');
render0to45('sum5Digits');

// 差5 / 和9 映射
const mapDiff5 = {0:5,1:6,2:7,3:8,4:9,5:0,6:1,7:2,8:3,9:4};
const mapSum9  = {0:9,1:8,2:7,3:6,4:5,5:4,6:3,7:2,8:1,9:0};

// ✅【核心修复】杀掉数字 = 添加 inactive（变白）
function killSingleDigit(boxDomId, numVal){
  const wrap = document.getElementById(boxDomId);
  const target = wrap.querySelector(`.digit[data-val="${numVal}"]`);
  if(target) target.classList.add('inactive');
}

// 执行杀号主函数
function runKillRule(num5){
  if(!num5 || num5.length!==5) return alert('请输入5位号码！');
  const w = Number(num5[0]);
  const q = Number(num5[1]);
  const b = Number(num5[2]);
  const s = Number(num5[3]);
  const g = Number(num5[4]);
  const useD5 = document.getElementById('useDiff5').checked;
  const useS9 = document.getElementById('useSum9').checked;

  if(useD5){
    killSingleDigit('wDigits', mapDiff5[w]);
    killSingleDigit('qDigits', mapDiff5[q]);
    killSingleDigit('bDigits', mapDiff5[b]);
    killSingleDigit('sDigits', mapDiff5[s]);
    killSingleDigit('gDigits', mapDiff5[g]);
  }
  if(useS9){
    killSingleDigit('wDigits', mapSum9[w]);
    killSingleDigit('qDigits', mapSum9[q]);
    killSingleDigit('bDigits', mapSum9[b]);
    killSingleDigit('sDigits', mapSum9[s]);
    killSingleDigit('gDigits', mapSum9[g]);
  }
}

// 【执行杀号按钮点击事件】
document.getElementById('execKillBtn').onclick = function(){
  const inputVal = document.getElementById('lastNumInput').value.trim();
  runKillRule(inputVal);
}

// 探数API拉取历史
async function fetchBatch(offset) {
  const res = await fetch(`/api/p5?offset=${offset}`);
  const ret = await res.json();
  console.log(ret);
  if(ret.code ===1 && ret.data && Array.isArray(ret.data.list)){
    return ret.data.list.map(item=>({...item, number:item.number.replace(/ /g,'')}));
  }
  return [];
}
// 一键获取100期
document.getElementById('fetchBtn').onclick = async function(){
  rawDataList = [];
  const batchSize=20, total=100;
  const batchCount = total / batchSize;
  for(let b=0;b<batchCount;b++){
    tipBox.innerText = `拉取中 ${b+1}/${batchCount}`;
    const list = await fetchBatch(b*batchSize);
    if(!list.length) break;
    rawDataList = rawDataList.concat(list);
    await new Promise(r=>setTimeout(r,400));
  }
  rawDataList = rawDataList.slice(0,total);
  tipBox.innerText = `✅载入${rawDataList.length}期`;
}
// 解析数据
document.getElementById('parseBtn').onclick = function(){
  if(!rawDataList.length) return tipBox.innerText='❌先获取历史';
  tipBox.innerText = `✅解析${rawDataList.length}期`;
  const last = rawDataList[0];
  if(last?.number?.length===5){
    document.getElementById('lastNumInput').value = last.number;
    runKillRule(last.number);
  }
}
// 重置和尾
document.getElementById('resetHw').onclick = function(){
  document.querySelectorAll('#hwDigits .digit').forEach(d=>d.classList.remove('inactive'));
}
// 清空前三位排除和值
document.getElementById('clearSum3').onclick = function(){
  document.querySelectorAll('#sum3Digits .digit').forEach(d=>d.classList.remove('inactive'));
}
// 清空五位排除和值
document.getElementById('clearSum5').onclick = function(){
  document.querySelectorAll('#sum5Digits .digit').forEach(d=>d.classList.remove('inactive'));
}
// 号码验证
document.getElementById('verifyBtn').onclick = function(){
  const v = document.getElementById('verifyInput').value.trim();
  if(v.length!==5) return alert('必须5位数字');
  alert('验证号码：'+v);
}
</script>
</body>
</html>
