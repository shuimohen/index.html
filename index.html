<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>排列五号码统计筛选极速工具</title>
<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, system-ui, Segoe UI, sans-serif;
}

body{
  background: #f0f2f5;
  padding: 12px;
  max-width: 960px;
  margin: 0 auto;
}

.card{
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

h3{
  margin-bottom: 12px;
  font-size: 16px;
  font-weight: 600;
  color: #222;
}

.row{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
  align-items: center;
}

.top-row{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}

.digit{
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 1px solid #dcdfe6;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-weight: 600;
  background: #4096ff;
  color: #fff;
  border-color: #4096ff;
  transition: all .2s;
}
/* inactive = 取消选中（杀号，变白底黑字） */
.digit.inactive{
  background: #fff;
  color: #222;
  border-color: #dcdfe6;
}

.btn{
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: #4096ff;
  color: #fff;
  cursor: pointer;
  font-size: 15px;
}

.btn.gray{
  background: #909399;
}

.btn.green{
  background: #67c23a;
}

.tip{
  margin: 8px 0;
  color: #333;
  font-weight: 500;
}

input[type="text"]{
  padding: 9px 10px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  font-size: 15px;
  width: 260px;
}

.check-row{
  display: flex;
  gap: 18px;
  margin: 8px 0;
  align-items: center;
}
</style>
</head>
<body>

<div class="card">
  <div class="top-row">
    <button id="fetchBtn" class="btn">一键获取近100期排列五</button>
    <button id="parseBtn" class="btn gray">解析数据</button>
    <span id="tipBox">无数据</span>
  </div>

  <div class="top-row">
    <span>上期开奖(5位):</span>
    <input type="text" id="lastNumInput" placeholder="如01490">
    <button id="execKillBtn" class="btn">执行差5/和9杀号</button>
  </div>

  <div class="check-row">
    <label><input type="checkbox" id="useDiff5" checked> 启用【差5恒值杀号】</label>
    <label><input type="checkbox" id="useSum9" checked> 启用【和9恒值杀号】</label>
  </div>
</div>

<div class="card">
  <h3>万 | 千 | 百 | 十 | 个 可选数字(点击色块切换蓝选)</h3>

  <div class="row">
    <span style="width:48px;">万位</span>
    <div class="row" id="wDigits"></div>
  </div>
  <div class="row">
    <span style="width:48px;">千位</span>
    <div class="row" id="qDigits"></div>
  </div>
  <div class="row">
    <span style="width:48px;">百位</span>
    <div class="row" id="bDigits"></div>
  </div>
  <div class="row">
    <span style="width:48px;">十位</span>
    <div class="row" id="sDigits"></div>
  </div>
  <div class="row">
    <span style="width:48px;">个位</span>
    <div class="row" id="gDigits"></div>
  </div>
</div>

<div class="card">
  <h3>和尾过滤（前三位和尾）</h3>
  <div class="row" id="hwDigits"></div>
  <div class="check-row">
    <label><input type="checkbox" id="useHwFilter" checked> 启用筛选:</label>
  </div>
</div>

<div class="card">
  <h3>排除前三位和值（0-27）</h3>
  <div class="row" id="sum3Digits"></div>
  <div class="row">
    <button class="btn gray" id="clearSum3">清空全部排除和值</button>
    <button class="btn gray" id="resetHw">重置和尾</button>
  </div>
</div>

<div class="card">
  <h3>排除五位和值（0-45）</h3>
  <div class="row" id="sum5Digits"></div>
  <div class="row">
    <button class="btn gray" id="clearSum5">清空全部排除五位和值</button>
  </div>
</div>

<div class="card">
  <h3>五位跨度筛选（号码最大值-最小值，范围0~9）</h3>
  <div class="row">
    <span>最小跨度:</span>
    <input type="number" id="minSpan" value="0" min="0" max="9" style="width:60px;">
    <span>最大跨度:</span>
    <input type="number" id="maxSpan" value="9" min="0" max="9" style="width:60px;">
    <label><input type="checkbox" id="useSpan" checked> 启用跨度:</label>
  </div>
</div>

<div class="card">
  <div class="row">
    <button id="genBtn" class="btn green">生成符合条件号码</button>
    <button id="copyBtn" class="btn">复制全部结果</button>
  </div>
  <div style="margin-top:12px;">
    <h4>号码验证</h4>
    <div class="row">
      <input type="text" id="verifyInput" placeholder="输入5位号码验证">
      <button id="verifyBtn" class="btn">验证号码</button>
    </div>
  </div>
</div>

<script>
let rawDataList = [];
const tipBox = document.getElementById('tipBox');

// 渲染0-9 默认蓝色选中
function renderDigitBox(containerId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  for(let i = 0; i <= 9; i++){
    const d = document.createElement("div");
    d.className = "digit";
    d.innerText = i;
    d.dataset.val = i;
    // 点击手动切换选中/取消
    d.onclick = () => d.classList.toggle("inactive");
    wrap.appendChild(d);
  }
}
// 渲染0~27 和值
function renderSum3Box(containerId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  for(let i = 0; i <= 27; i++){
    const d = document.createElement("div");
    d.className = "digit";
    d.innerText = i;
    d.dataset.val = i;
    d.onclick = () => d.classList.toggle("inactive");
    wrap.appendChild(d);
  }
}
// 渲染0~45 五位和值
function renderSum5Box(containerId){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";
  for(let i = 0; i <= 45; i++){
    const d = document.createElement("div");
    d.className = "digit";
    d.innerText = i;
    d.dataset.val = i;
    d.onclick = () => d.classList.toggle("inactive");
    wrap.appendChild(d);
  }
}

renderDigitBox("wDigits");
renderDigitBox("qDigits");
renderDigitBox("bDigits");
renderDigitBox("sDigits");
renderDigitBox("gDigits");
renderDigitBox("hwDigits");
renderSum3Box("sum3Digits");
renderSum5Box("sum5Digits");

// 差5、和9映射表
const mapDiff5 = {0:5,1:6,2:7,3:8,4:9,5:0,6:1,7:2,8:3,9:4};
const mapSum9  = {0:9,1:8,2:7,3:6,4:5,5:4,6:3,7:2,8:1,9:0};

// ✅【修复】杀号逻辑：杀掉=添加 inactive（变白）
function killDigit(boxId, val){
  const wrap = document.getElementById(boxId);
  const item = wrap.querySelector(`.digit[data-val="${val}"]`);
  if(item){
    item.classList.add("inactive");
  }
}

function runKillByNum(numStr){
  if(!numStr || numStr.length !== 5) return;
  const useD5 = document.getElementById("useDiff5").checked;
  const useS9 = document.getElementById("useSum9").checked;

  const w = Number(numStr[0]);
  const q = Number(numStr[1]);
  const b = Number(numStr[2]);
  const s = Number(numStr[3]);
  const g = Number(numStr[4]);

  if(useD5){
    killDigit("wDigits", mapDiff5[w]);
    killDigit("qDigits", mapDiff5[q]);
    killDigit("bDigits", mapDiff5[b]);
    killDigit("sDigits", mapDiff5[s]);
    killDigit("gDigits", mapDiff5[g]);
  }
  if(useS9){
    killDigit("wDigits", mapSum9[w]);
    killDigit("qDigits", mapSum9[q]);
    killDigit("bDigits", mapSum9[b]);
    killDigit("sDigits", mapSum9[s]);
    killDigit("gDigits", mapSum9[g]);
  }
}

// 探数接口拉取历史
async function fetchHistoryBatch(offset) {
  const res = await fetch(`/api/p5?offset=${offset}`);
  const ret = await res.json();
  console.log("分批原始返回：", ret);
  if (ret.code === 1 && ret.data && Array.isArray(ret.data.list)) {
    const cleanList = ret.data.list.map(item=>{
      return {
        ...item,
        number: item.number.replace(/ /g,"")
      }
    })
    return cleanList;
  }
  return [];
}

// 一键获取
document.getElementById("fetchBtn").addEventListener("click", async function () {
  rawDataList = [];
  const batchSize = 20;
  const targetTotal = 100;
  const totalBatch = targetTotal / batchSize;
  for (let batch = 0; batch < totalBatch; batch++) {
    const offset = batch * batchSize;
    tipBox.innerText = `正在分批拉取：第${batch + 1}/${totalBatch}批`;
    const list = await fetchHistoryBatch(offset);
    if (list.length === 0) break;
    rawDataList = rawDataList.concat(list);
    await new Promise(resolve => setTimeout(resolve, 400));
  }
  rawDataList = rawDataList.slice(0, targetTotal);
  tipBox.innerText = `✅已载入${rawDataList.length}期，可点【解析数据】`;
});

// 解析数据自动填充上期并杀号
document.getElementById("parseBtn").addEventListener("click", function () {
  if (!rawDataList || rawDataList.length === 0) {
    tipBox.innerText = "❌暂无数据，请先获取历史";
    return;
  }
  tipBox.innerText = `✅解析完成，共${rawDataList.length}期`;
  const lastItem = rawDataList[0];
  if(lastItem && lastItem.number && lastItem.number.length===5){
    document.getElementById("lastNumInput").value = lastItem.number;
    runKillByNum(lastItem.number);
  }
});

// 执行杀号按钮
document.getElementById("execKillBtn").addEventListener("click", function(){
  const val = document.getElementById("lastNumInput").value.trim();
  runKillByNum(val);
});

// 号码验证
document.getElementById("verifyBtn").addEventListener("click", function(){
  const val = document.getElementById("verifyInput").value.trim();
  if(val.length !==5){alert("请输入5位排列五号码");return;}
  alert("号码验证成功："+val);
});
</script>
</body>
</html>
