<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>排列五号码统计筛选极速工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,Segoe UI,sans-serif;}
body{background:#f0f2f5;padding:12px;max-width:960px;margin:0 auto;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #00000018;}
h3{margin-bottom:10px;color:#222;font-size:16px;}
textarea{width:100%;height:130px;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px;resize:vertical;}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;align-items:center;}
.label-block{width:100%;margin:6px 0 2px;font-size:14px;color:#333;display:flex;gap:8px;align-items:center;}
.digit-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.digit-tag{
    padding:5px 10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    user-select:none;
    transition:0.15s;
    background:#fff;
}
.digit-tag.active{
    background:#2563eb;
    color:#fff;
    border-color:#2563eb;
}
.digit-tag.top8{
    border-color:#60a5fa;
}
input[type="number"]{width:72px;padding:7px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
input[type="text"]{padding:7px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
button{padding:9px 16px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer;}
button:active{background:#1d4ed8;}
.btn-sm{padding:4px 8px;font-size:12px;background:#64748b;}
.pos-stat-wrap{margin:12px 0;border-bottom:1px solid #eee;padding-bottom:12px;}
.pos-stat-wrap:last-child{border-bottom:none;}
.pos-title{font-size:14px;margin:6px 0 4px;color:#444;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pos-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pos-digit{min-width:42px;text-align:center;padding:6px 4px;border-radius:6px;font-size:13px;cursor:pointer;user-select:none;border:1px solid #ddd;background:#fff;transition:0.15s;}
.pos-digit.top8{border-color:#60a5fa;}
.pos-digit.active{background:#2563eb;color:#fff;border-color:#2563eb;}
#resultBox{min-height:180px;border:1px solid #ddd;padding:10px;border-radius:8px;font-size:14px;max-height:340px;overflow:auto;white-space:pre-wrap;}
.warn{color:#dc2626;font-size:13px;margin-bottom:8px;}
.info-text{font-size:13px;color:#555;margin:4px 0;}
.stat-block{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}

.wrap-lev1{margin:14px 0;}
.lev1-wrap-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px 12px;
}
.stat-tag{
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
    border-bottom:3px solid transparent;
    white-space:normal;
    line-height:1.45;
}
.stat-tag.level1{
    background:#bfdbfe;
    border-bottom-color:#2563eb;
    width:100%;
    max-width:48%;
}
.stat-tag.level1.open{
    background:#22c55e;
    color:#fff;
    border-bottom-color:#16a34a;
}
.stat-tag.level2{
    background:#ddd6fe;
    width:100%;
}
.stat-tag.level2.open{
    background:#a855f7;
    color:#fff;
}
.stat-tag.level3{
    background:#fed7aa;
    flex:1 1 46%;
    min-width:130px;
}
.sub-panel{
    margin:10px 0 0 16px;
    border-left:2px solid #cbd5e1;
    padding:10px 0 10px 12px;
    display:none;
}
.sub-panel.show{
    display:block;
}
.lv2-item{
    margin-bottom:10px;
}
.lv3-panel{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
    padding-right:8px;
}

.tip-top8{color:#2563eb;font-size:13px;margin:6px 0;}
.rule-tip{display:none;}
.kill-notice{display:none;}
.section-gap{margin-top:16px;padding-top:12px;border-top:1px solid #eee;}
.rule-title{font-weight:bold;color:#1e40af;margin-top:10px;}
.pos-kill-wrap{margin:8px 0;}
.pos-kill-line{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap;}
.pos-kill-label{width:50px;font-size:13px;color:#333;}
</style>
</head>
<body>
<div class="card">
    <div class="warn">⚠️免责：排列五开奖完全随机，历史统计不能预测结果，仅供娱乐学习，请勿过度投入。</div>
    <h3>1.粘贴历史开奖数据｜或【一键获取排列五近100期】</h3>
    <textarea id="historyInput" placeholder="一行1个5位号码，可直接点下方按钮拉取排列五近100期"></textarea>
    <div class="row">
        <button onclick="parseHistory()">解析历史数据</button>
        <button onclick="fetchP5History()">一键获取排列五近100期</button>
        <button onclick="fillMock100History()">填充测试100期（本地模拟）</button>
        <span id="parseTip"></span>
    </div>
    <div class="tip-top8" id="top8Tip"></div>
</div>

<div class="card">
    <h3>分位数字频次+可选数字池（蓝色边框=历史前8高频；点击数字块切换蓝色选中）</h3>
    <div id="statPanel"></div>
    <div class="info-text">每一位操作按钮：全选0-9 / 清空当前位 / 还原历史TOP8高频数字</div>
</div>

<div class="card">
    <h3>2.差5/和9恒值分位杀号规则设置</h3>
    <div class="row">
        <label>上期开奖号码：</label>
        <input type="text" id="lastNumInput" placeholder="输入上期5位开奖号，自动计算分位杀号">
        <button onclick="calcKillRule()">计算两套分位杀号规则</button>
    </div>
    <div class="kill-notice" id="killRuleTip"></div>

    <div class="section-gap">
        <div class="label-block rule-title">
            ① 差5恒值【分位杀号】
            <label><input type="checkbox" id="useDiff5Kill" checked>启用差5杀号过滤</label>
        </div>
        <div class="pos-kill-wrap" id="diff5PosKillBox"></div>

        <div class="label-block rule-title">② 和9恒值【分位杀号】
            <label><input type="checkbox" id="useSum9Kill" checked>启用和9杀号过滤</label>
        </div>
        <div class="pos-kill-wrap" id="sum9PosKillBox"></div>

        <div class="label-block rule-title">③ 万/千/百位胆码（前三位必须包含至少一个，点击色块手动修改）
            <label style="margin-left:10px;"><input type="checkbox" id="useDanFilter" checked>启用胆码过滤</label>
        </div>
        <div class="digit-group" id="danBox"></div>
        <div class="row" style="margin-top:8px;">
            <button onclick="clearAllKillDan()">清空全部杀号胆码选中</button>
        </div>
    </div>

    <div class="section-gap">
        <h3>候选号码生成条件</h3>
        <div class="row">
            <label>号码长度：</label>
            <select id="lenSel">
                <option value="3">3位</option>
                <option value="4">4位</option>
                <option value="5" selected>5位</option>
            </select>
        </div>
        <div class="row">
            <label>前三位和值范围(0-27)：</label>
            <input type="number" id="sum3Min" placeholder="最小">
            <span>‑</span>
            <input type="number" id="sum3Max" placeholder="最大">
        </div>
        <div class="row">
            <label>五位整体和值范围(0-45)：</label>
            <input type="number" id="sum5Min" placeholder="最小">
            <span>‑</span>
            <input type="number" id="sum5Max" placeholder="最大">
        </div>
        <div class="row">
            <label>跨度范围：</label>
            <input type="number" id="spanMin" placeholder="最小">
            <span>‑</span>
            <input type="number" id="spanMax" placeholder="最大">
        </div>
        <div class="row">
            <label>排除前三位和尾(多个连写，例258)：</label>
            <input type="text" id="killSumTail" placeholder="排除前三位和尾">
        </div>
        <div class="row">
            <label><input type="checkbox" id="allowDup">允许号码内部重复数字</label>
        </div>
        <div class="row">
            <label><input type="checkbox" id="excludeHistory" checked>排除历史已开出号码</label>
        </div>
        <div class="row">
            <button onclick="genCandidates()">生成候选号码</button>
            <button onclick="copyResult()">复制全部结果</button>
        </div>

        <div class="row" style="margin-top:12px;border-top:1px solid #eee;padding-top:12px;">
            <label>校验号码：</label>
            <input type="text" id="checkNumInput" placeholder="输入5位号码">
            <button onclick="checkNumber()">校验是否存在结果中</button>
        </div>

        <div class="info-text">候选总数：<span id="totalCnt">0</span>｜一级标签点击展开二级；二级标签点击自动展开三级</div>
        <div id="classStatPanel"></div>
        <div id="resultBox"></div>
    </div>
</div>

<script>
let historyList = [];
let historySet = new Set();
let posFreq = [new Array(10).fill(0),new Array(10).fill(0),new Array(10).fill(0),new Array(10).fill(0),new Array(10).fill(0)];
let posTop8Digits = [[],[],[],[],[],[]];
let posCheckDigits = [[],[],[],[],[]];
let globalResultList = [];
let rawResultText = "";
const posName = ['万位','千位','百位','十位','个位'];

const diff5Map = {0:5,1:6,2:7,3:8,4:9,5:0,6:1,7:2,8:3,9:4};
const sum9Map = {0:9,1:8,2:7,3:6,4:5,5:4,6:3,7:2,8:1,9:0};

let diff5PosKill = [new Set(),new Set(),new Set(),new Set(),new Set()];
let sum9PosKill = [new Set(),new Set(),new Set(),new Set(),new Set()];

window.onload = function(){
    renderPosKillPanel();
    createDigitBlocks("danBox", "d");
    renderPosPanel();
}

// ==========【新增核心函数：一键拉取排列五近100期】==========
async function fetchP5History(){
    const tip = document.getElementById("parseTip");
    tip.innerText = "正在拉取排列五近100期...";
    try{
        // ⚠️部署到Vercel之后，下面地址换成你自己域名：https://xxx.vercel.app/api/p5
        const res = await fetch("/api/p5");
        const json = await res.json();
        if(!json.ok || !Array.isArray(json.data) || json.data.length===0){
            tip.innerText = "❌拉取失败，接口无数据";
            return;
        }
        const arr = json.data.filter(s=>/^\d{5}$/.test(s));
        document.getElementById("historyInput").value = arr.join("\n");
        parseHistory();
        tip.innerText = `✅成功拉取排列五${arr.length}期，已自动解析`;
    }catch(err){
        tip.innerText = "❌网络异常，检查api/p5接口是否部署成功";
        console.error(err);
    }
}

// 本地模拟测试数据
function fillMock100History(){
    const mock = [];
    for(let i=0;i<100;i++){
        const a = Math.floor(Math.random()*10);
        const b = Math.floor(Math.random()*10);
        const c = Math.floor(Math.random()*10);
        const d = Math.floor(Math.random()*10);
        const e = Math.floor(Math.random()*10);
        mock.push(`${a}${b}${c}${d}${e}`);
    }
    document.getElementById("historyInput").value = mock.join("\n");
    parseHistory();
}

function renderPosKillPanel(){
    let d5Html = "";
    for(let p=0;p<5;p++){
        d5Html += `<div class="pos-kill-line">
            <span class="pos-kill-label">${posName[p]}</span>
            <div class="digit-group" style="margin:0;" id="d5p${p}">`;
        for(let d=0;d<=9;d++){
            d5Html += `<div class="digit-tag" id="d5p${p}_${d}" onclick="togglePosKill('d5',${p},${d})">${d}</div>`;
        }
        d5Html += `</div></div>`;
    }
    document.getElementById("diff5PosKillBox").innerHTML = d5Html;

    let s9Html = "";
    for(let p=0;p<5;p++){
        s9Html += `<div class="pos-kill-line">
            <span class="pos-kill-label">${posName[p]}</span>
            <div class="digit-group" style="margin:0;" id="s9p${p}">`;
        for(let d=0;d<=9;d++){
            s9Html += `<div class="digit-tag" id="s9p${p}_${d}" onclick="togglePosKill('s9',${p},${d})">${d}</div>`;
        }
        s9Html += `</div></div>`;
    }
    document.getElementById("sum9PosKillBox").innerHTML = s9Html;
}

function togglePosKill(type, pos, d){
    const el = document.getElementById(`${type}p${pos}_${d}`);
    let store = type==="d5" ? diff5PosKill : sum9PosKill;
    if(store[pos].has(d)){
        store[pos].delete(d);
        el.classList.remove("active");
    }else{
        store[pos].add(d);
        el.classList.add("active");
    }
}

function setPosKillDigits(type, pos, numArr){
    let store = type==="d5" ? diff5PosKill : sum9PosKill;
    store[pos].clear();
    for(let d=0;d<=9;d++) document.getElementById(`${type}p${pos}_${d}`).classList.remove('active');
    for(let d of numArr){
        store[pos].add(d);
        document.getElementById(`${type}p${pos}_${d}`).classList.add('active');
    }
}

function createDigitBlocks(wrapId, prefix){
    const wrap = document.getElementById(wrapId);
    let html = "";
    for(let d=0;d<=9;d++){
        html += `<div class="digit-tag" id="${prefix}${d}" onclick="toggleSingleBlock('${prefix}',${d})">${d}</div>`;
    }
    wrap.innerHTML = html;
}
function toggleSingleBlock(prefix, d){
    const el = document.getElementById(`${prefix}${d}`);
    el.classList.toggle('active');
}
function getCheckedDigits(prefix){
    let arr = [];
    for(let d=0;d<=9;d++){
        const el = document.getElementById(`${prefix}${d}`);
        if(el.classList.contains('active')) arr.push(d);
    }
    return arr;
}

function clearAllKillDan(){
    for(let p=0;p<5;p++){
        setPosKillDigits("d5",p,[]);
        setPosKillDigits("s9",p,[]);
    }
    for(let d=0;d<=9;d++){
        document.getElementById(`d${d}`).classList.remove('active');
    }
}

const pad5 = s => s.padStart(5,'0');

function getTop8Digits(freqArr){
    const arr = [];
    for(let d=0;d<10;d++) arr.push({d, c:freqArr[d]});
    arr.sort((a,b)=>b.c - a.c || a.d - b.d);
    return arr.slice(0,8).map(x=>x.d);
}

function renderPosPanel(){
    const panel = document.getElementById('statPanel');
    let html = "";
    for(let p=0;p<5;p++){
        html += `<div class="pos-stat-wrap">
        <div class="pos-title">
            <span>${posName[p]}</span>
            <button class="btn-sm" onclick="posSelectAll(${p})">全选0-9</button>
            <button class="btn-sm" onclick="posClear(${p})">清空</button>
            <button class="btn-sm" onclick="posRestoreTop8(${p})">还原TOP8</button>
        </div>
        <div class="pos-row">`;
        const top8 = new Set(posTop8Digits[p]);
        for(let d=0;d<=9;d++){
            const checked = posCheckDigits[p].includes(d) ? "active" : "";
            const top8Flag = top8.has(d) ? "top8" : "";
            html += `<div class="pos-digit ${checked} ${top8Flag}" id="pos${p}_${d}" onclick="togglePosDigit(${p},${d})">${d}(${posFreq[p][d]})</div>`;
        }
        html += `</div></div>`;
    }
    panel.innerHTML = html;
}

function togglePosDigit(posIdx, d){
    const el = document.getElementById(`pos${posIdx}_${d}`);
    el.classList.toggle('active');
    savePosCheck(posIdx);
}
function savePosCheck(posIdx){
    let arr = [];
    for(let d=0;d<=9;d++){
        const el = document.getElementById(`pos${posIdx}_${d}`);
        if(el.classList.contains('active')) arr.push(d);
    }
    posCheckDigits[posIdx] = arr;
}
function posSelectAll(posIdx){
    for(let d=0;d<=9;d++) document.getElementById(`pos${posIdx}_${d}`).classList.add('active');
    savePosCheck(posIdx);
}
function posClear(posIdx){
    for(let d=0;d<=9;d++) document.getElementById(`pos${posIdx}_${d}`).classList.remove('active');
    savePosCheck(posIdx);
}
function posRestoreTop8(posIdx){
    const top8 = posTop8Digits[posIdx];
    for(let d=0;d<=9;d++) document.getElementById(`pos${posIdx}_${d}`).classList.remove('active');
    top8.forEach(d=>document.getElementById(`pos${posIdx}_${d}`).classList.add('active'));
    savePosCheck(posIdx);
}

function parseHistory(){
    const txt = document.getElementById('historyInput').value;
    const lines = txt.split('\n').map(s=>s.trim()).filter(s=>/^\d{3,5}$/.test(s));
    historyList = [...new Set(lines)];
    historySet = new Set(historyList);
    posFreq = [new Array(10).fill(0),new Array(10).fill(0),new Array(10).fill(0),new Array(10).fill(0),new Array(10).fill(0)];
    for(let s of historyList){
        const p = pad5(s);
        posFreq[0][+p[0]]++;
        posFreq[1][+p[1]]++;
        posFreq[2][+p[2]]++;
        posFreq[3][+p[3]]++;
        posFreq[4][+p[4]]++;
    }
    posTop8Digits = [[],[],[],[],[]];
    let tipText = "";
    for(let i=0;i<5;i++){
        posTop8Digits[i] = getTop8Digits(posFreq[i]);
        tipText += `${posName[i]}Top8：${posTop8Digits[i].join('')}；`;
        posCheckDigits[i] = [...posTop8Digits[i]];
    }
    document.getElementById('top8Tip').innerText = tipText;
    renderPosPanel();
    document.getElementById('parseTip').innerText = `成功解析 ${historyList.length} 条历史记录，自动激活每一位前8高频数字，点击数字块可手动修改`;
}

function calcKillRule(){
    clearAllKillDan();
    const input = document.getElementById('lastNumInput').value.trim();
    if(!/^\d{3,5}$/.test(input)){
        document.getElementById('killRuleTip').innerText = "";
        return;
    }
    const num5 = pad5(input);
    let diff5Log = [];
    let sum9Log = [];
    for(let p=0;p<5;p++){
        const currNum = Number(num5[p]);
        const d5k = diff5Map[currNum];
        const s9k = sum9Map[currNum];
        setPosKillDigits("d5", p, [d5k]);
        setPosKillDigits("s9", p, [s9k]);
        diff5Log.push(`${posName[p]}开出${currNum} → 差5杀${d5k}`);
        sum9Log.push(`${posName[p]}开出${currNum} → 和9杀${s9k}`);
    }
    document.getElementById('killRuleTip').innerText = "";
}

function calcNumAttr(num){
    const arr = num.split('').map(Number);
    const p5 = pad5(num);
    const s3 = arr[0]+arr[1]+arr[2];
    const s5 = arr.reduce((a,b)=>a+b,0);
    const min = Math.min(...arr);
    const max = Math.max(...arr);
    const span = max - min;
    const dup = new Set(arr).size !== arr.length;
    const tail3 = s3 % 10;
    const first = arr[0];
    const cntMap = {};
    arr.forEach(d=>cntMap[d]=(cntMap[d]||0)+1);
    const cnts = Object.values(cntMap).sort((a,b)=>b-a);
    let type;
    const m = cnts[0];
    if(m===5) type="豹子";
    else if(m===4) type="组五";
    else if(m===3) type = cnts[1]===2 ? "组10" : "组20";
    else if(m===2) type = cnts[1]===2 ? "组30" : "组60";
    else type="组120";
    return {s3,s5,span,dup,tail3,first,type,p5,num,digits:arr};
}

function filterByAttr(attr,opt){
    const arr = attr.digits;
    const len = arr.length;
    if(!opt.allowDup && attr.dup) return false;
    if(opt.sum3Min!==null && attr.s3 < opt.sum3Min) return false;
    if(opt.sum3Max!==null && attr.s3 > opt.sum3Max) return false;
    if(opt.sum5Min!==null && attr.s5 < opt.sum5Min) return false;
    if(opt.sum5Max!==null && attr.s5 > opt.sum5Max) return false;
    if(opt.spanMin!==null && attr.span < opt.spanMin) return false;
    if(opt.spanMax!==null && attr.span > opt.spanMax) return false;
    if(opt.excludeHis && historySet.has(attr.num)) return false;

    if(opt.useDiff5){
        for(let p=0;p<len;p++){
            const d = arr[p];
            if(diff5PosKill[p].has(d)) return false;
        }
    }
    if(opt.useSum9){
        for(let p=0;p<len;p++){
            const d = arr[p];
            if(sum9PosKill[p].has(d)) return false;
        }
    }

    if(opt.useDan && opt.danDigits.length>0){
        let has = false;
        const front3 = arr.slice(0,3);
        for(let dd of opt.danDigits){
            if(front3.includes(dd)){ has=true; break; }
        }
        if(!has) return false;
    }

    if(opt.killSumTail && opt.killSumTail.includes(String(attr.tail3))) return false;
    return true;
}

function fastExhaust(len, opt){
    const res = [];
    const pools = posCheckDigits.slice(0,len);
    for(let i=0;i<pools.length;i++){
        if(pools[i].length===0){
            alert(`${posName[i]}未选中任何数字，无法生成号码`);
            return [];
        }
    }
    const p0 = pools[0],p1=pools[1],p2=pools[2],p3=pools[3],p4=pools[4];
    if(len===3){
        for(let a of p0)for(let b of p1)for(let c of p2){
            const n = ""+a+b+c;
            const at = calcNumAttr(n);
            if(filterByAttr(at,opt)) res.push(n);
        }
    }else if(len===4){
        for(let a of p0)for(let b of p1)for(let c of p2)for(let d of p3){
            const n = ""+a+b+c+d;
            const at = calcNumAttr(n);
            if(filterByAttr(at,opt)) res.push(n);
        }
    }else if(len===5){
        for(let a of p0)for(let b of p1)for(let c of p2)for(let d of p3)for(let e of p4){
            const n = ""+a+b+c+d+e;
            const at = calcNumAttr(n);
            if(filterByAttr(at,opt)) res.push(n);
        }
    }
    return res;
}

function renderClassStats(list){
    const typeMap = {"组120":[],"组60":[],"组30":[],"组20":[],"组10":[],"组五":[],"豹子":[]};
    const rangeRule = [
        {k:"r02",lab:"0‑2开头",f:x=>x<=2},
        {k:"r35",lab:"3‑5开头",f:x=>x>=3&&x<=5},
        {k:"r68",lab:"6‑8开头",f:x=>x>=6&&x<=8},
        {k:"r9",lab:"9开头",f:x=>x===9}
    ];
    const singleRule = Array.from({length:10},(_,i)=>({k:`d${i}`,lab:`${i}开头`,f:x=>x===i}));

    for(let num of list){
        const at = calcNumAttr(num);
        typeMap[at.type].push({num,f:at.first});
    }

    let lev1Arr = [];
    for(let t in typeMap){
        const arr = typeMap[t];
        if(arr.length>0) lev1Arr.push({type:t,data:arr});
    }

    let html = `<div class="lev1-wrap-row">`;
    for(let item of lev1Arr){
        const t = item.type;
        const arr = item.data;
        html += `<div class="wrap-lev1">
            <span class="stat-tag level1" data-type="${t}" onclick="toggleLevel1(this)">${t}（${arr.length}注）</span>
            <div class="sub-panel lv2-panel">`;
                for(let rg of rangeRule){
                    const rList = arr.filter(x=>rg.f(x.f));
                    if(!rList.length) continue;
                    html += `<div class="lv2-item">
                        <span class="stat-tag level2" data-type="${t}" data-rkey="${rg.k}" onclick="toggleLevel2(this)">${rg.lab}（${rList.length}注）</span>
                        <div class="sub-panel lv3-panel">`;
                            for(let s of singleRule){
                                const sList = rList.filter(x=>s.f(x.f));
                                if(!sList.length) continue;
                                html += `<span class="stat-tag level3" data-type="${t}" data-rkey="${rg.k}" data-skey="${s.k}" onclick="copyLv3(this)">${s.lab}（${sList.length}注）</span>`;
                            }
                        html += `</div>
                    </div>`;
                }
            html += `</div>
        </div>`;
    }
    html += `</div>`;
    document.getElementById('classStatPanel').innerHTML = html;
}

function toggleLevel1(el){
    const t = el.dataset.type;
    el.classList.toggle("open");
    const panel = el.nextElementSibling;
    if(panel){
        panel.classList.toggle("show");
    }
    const all = globalResultList.filter(x=>calcNumAttr(x).type===t);
    navigator.clipboard.writeText(all.join('\n')).then(()=>alert(`已复制【${t}】${all.length}条`));
}

function toggleLevel2(el){
    const t = el.dataset.type;
    const rk = el.dataset.rkey;
    el.classList.toggle("open");
    const panel = el.nextElementSibling;
    if(panel){
        panel.classList.toggle("show");
    }
    const all = globalResultList.filter(x=>{
        const a = calcNumAttr(x);
        if(a.type!==t) return false;
        if(rk==="r02") return a.first<=2;
        if(rk==="r35") return a.first>=3&&a.first<=5;
        if(rk==="r68") return a.first>=6&&a.first<=8;
        if(rk==="r9") return a.first===9;
        return false;
    });
    navigator.clipboard.writeText(all.join('\n')).then(()=>alert(`已复制二级分组 ${el.innerText}，共${all.length}条`));
}

function copyLv3(el){
    const t = el.dataset.type;
    const rk = el.dataset.rkey;
    const sk = el.dataset.skey;
    const all = globalResultList.filter(x=>{
        const a = calcNumAttr(x);
        if(a.type!==t) return false;
        if(rk==="r02") return a.first<=2;
        if(rk==="r35") return a.first>=3&&a.first<=5;
        if(rk==="r68") return a.first>=6&&a.first<=8;
        if(rk==="r9") return a.first===9;
        return a.first===Number(sk.replace('d',''));
    });
    navigator.clipboard.writeText(all.join('\n')).then(()=>alert(`已复制三级分组 ${el.innerText}，共${all.length}条`));
}

function genCandidates(){
    const ruleDanDigits = getCheckedDigits("d").map(Number);
    const useDanFilter = document.getElementById("useDanFilter").checked;
    const useDiff5Kill = document.getElementById("useDiff5Kill").checked;
    const useSum9Kill = document.getElementById("useSum9Kill").checked;
    const targetLen = +document.getElementById('lenSel').value;

    const opt = {
        sum3Min: document.getElementById('sum3Min').value===''?null:+document.getElementById('sum3Min').value,
        sum3Max: document.getElementById('sum3Max').value===''?null:+document.getElementById('sum3Max').value,
        sum5Min: document.getElementById('sum5Min').value===''?null:+document.getElementById('sum5Min').value,
        sum5Max: document.getElementById('sum5Max').value===''?null:+document.getElementById('sum5Max').value,
        spanMin: document.getElementById('spanMin').value===''?null:+document.getElementById('spanMin').value,
        spanMax: document.getElementById('spanMax').value===''?null:+document.getElementById('spanMax').value,
        allowDup: document.getElementById('allowDup').checked,
        excludeHis: document.getElementById('excludeHistory').checked,
        killSumTail: document.getElementById('killSumTail').value.trim(),
        danDigits: ruleDanDigits,
        useDan: useDanFilter,
        useDiff5: useDiff5Kill,
        useSum9: useSum9Kill
    };
    const res = fastExhaust(targetLen,opt);
    globalResultList = res;
    rawResultText = res.join('\n');
    document.getElementById('totalCnt').innerText = res.length;
    renderClassStats(res);
    document.getElementById('resultBox').textContent = rawResultText;
}

function copyResult(){
    if(!rawResultText) return alert("暂无结果");
    navigator.clipboard.writeText(rawResultText).then(()=>alert("复制成功"));
}

function checkNumber(){
    const input = document.getElementById('checkNumInput').value.trim();
    if(!/^\d+$/.test(input)) return alert("请输入纯数字");
    if(!globalResultList.length) return alert("请先生成候选");
    const idx = globalResultList.indexOf(input);
    const box = document.getElementById('resultBox');
    if(idx>-1){
        alert(`✅找到号码：${input}`);
        box.scrollTop = idx * 20;
    }else{
        alert(`❌未找到号码：${input}`);
    }
}
